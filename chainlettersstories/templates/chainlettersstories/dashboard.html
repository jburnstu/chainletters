{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>writePage</title>
    <link rel="stylesheet" href= "{% static 'chainlettersstories/styles.css' %}" />
</head>

<body>
    <h1>Hi, {{object.displayname}}!</h1><br>
    <header>
        <form action="{% url 'chainlettersstories:dashboard' object.id %}">
            <button type="submit">DASHBOARD</button>
        </form>
        <form action="{% url 'chainlettersstories:write_dashboard' object.id %}">
            <button type="submit">WRITE</button>
        </form>
        <form action="{% url 'chainlettersstories:read_dashboard' object.id %}">
            <button type="submit">READ</button>
        </form>
        <form action="{% url 'chainlettersstories:login_or_signup_page'%}">
            <button type="submit">LOG OUT</button>
        </form>
    </header>
</body>

</html>
